name: Publish instrument catalog

on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "30 11 * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy Pages even when catalog data is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: instrument-catalog-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      should_deploy: ${{ steps.build.outputs.should_deploy }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: pytest -q

      - name: Build verified catalog
        id: build
        shell: bash
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          EXCLUDED_ASSET_IDS: ${{ secrets.EXCLUDED_ASSET_IDS }}
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
        run: |
          set -euo pipefail
          catalog_output="$(asset-catalog \
            --site-root site \
            --history-output catalog.json \
            --history-manifest-output manifest.json \
            --hydrate-url https://bluek209.github.io/asset-catalog/)"
          echo "$catalog_output"
          changed=false
          if [[ "$catalog_output" == catalog\ updated:* ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          should_deploy=false
          if [[ "$changed" == true || "$FORCE_DEPLOY" == true ]]; then
            should_deploy=true
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          catalog_version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("site/manifest.json").read_text(encoding="utf-8"))["l"])')"
          echo "version=$catalog_version" >> "$GITHUB_OUTPUT"

      - name: Verify generated site
        run: asset-catalog --site-root site --verify-only

      - name: Commit readable catalog history
        env:
          CATALOG_VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          history_dir="$(mktemp -d)"

          if git ls-remote --exit-code --heads origin catalog-data >/dev/null 2>&1; then
            git fetch origin catalog-data:refs/remotes/origin/catalog-data
            git worktree add -b catalog-data "$history_dir" origin/catalog-data
          else
            git worktree add --detach "$history_dir" HEAD
            git -C "$history_dir" switch --orphan catalog-data
          fi

          git -C "$history_dir" rm -rf --ignore-unmatch .
          cat > "$history_dir/README.md" <<'EOF'
          # Asset Catalog data history

          `catalog.json` is the human-readable catalog history deployed to GitHub Pages.
          `manifest.json` is the human-readable Pages manifest history.
          Both files are generated by GitHub Actions; review changes with GitHub or `git diff`.
          EOF

          cp catalog.json "$history_dir/catalog.json"
          cp manifest.json "$history_dir/manifest.json"
          git -C "$history_dir" config user.name "github-actions[bot]"
          git -C "$history_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$history_dir" add README.md catalog.json manifest.json

          tracked_files="$(git -C "$history_dir" ls-files)"
          if [[ "$tracked_files" != $'README.md\ncatalog.json\nmanifest.json' ]]; then
            echo "Unexpected tracked files in catalog-data branch:" >&2
            printf '%s\n' "$tracked_files" >&2
            exit 1
          fi

          if git -C "$history_dir" diff --cached --quiet; then
            echo "Readable catalog unchanged"
            exit 0
          fi

          git -C "$history_dir" commit -m "data: 카탈로그 ${CATALOG_VERSION} 갱신"
          git -C "$history_dir" push origin HEAD:catalog-data

      - name: Configure Pages
        if: steps.build.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.build.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
